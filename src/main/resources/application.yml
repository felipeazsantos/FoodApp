spring:
  application:
    name: FoodApp

  # MySQL Connection
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodapp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # SMTP Mail
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # PostgreSQL Connection (example)
  # To use PostgreSQL, comment out the MySQL datasource above and uncomment
  # the properties below. Also enable the PostgreSQL driver in pom.xml.
  # datasource:
  #   url: ${DB_URL:jdbc:postgresql://localhost:5432/foodapp}
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:postgres}
  #   driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


server:
  port: 8090

secretJwtString: food123456789app123456789food123456789app123456789

#AWS CONFIG
aws:
  s3:
    region:
    bucket:
  accessKeyId:
  secretKey: