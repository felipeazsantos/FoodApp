services:
  mysql:
    image: mysql:8.4
    container_name: foodapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foodapp
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - foodapp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  foodapp_mysql_data:
